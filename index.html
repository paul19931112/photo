<style>
  :root{
    --amber:#E9A05C;
    --amber-dark:#C97A3C;
    --terracotta:#9E4E22;
    --cream:#FDF4E8;
    --cream-warm:#FAE7C9;
    --text:#43301E;
    --text-soft:#8A6A4C;
    --text-faint:#AF9370;
    --viewer-bg:#1E1509;
    --shadow: 0 14px 30px -20px rgba(67,48,30,.5);
    --grad: linear-gradient(135deg,var(--amber),var(--amber-dark));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:#EFE6D6;
    min-height:100%;
    display:flex;
    justify-content:center;
    color:var(--text);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
  }
  .screen{
    display:none;
    flex-direction:column;
    padding:22px 24px 32px;
    min-height:100vh;
    animation: fadeIn .35s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  h1.title{text-align:center; font-size:26px; font-weight:700; margin:6px 0 4px; color:var(--terracotta); letter-spacing:.01em;}
  p.subtitle{text-align:center; font-size:14.5px; color:var(--text-soft); margin:0 0 20px; line-height:1.8;}
  .label-mono{font:600 11px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.12em; color:var(--text-faint);}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; text-align:center; padding:17px 16px; border-radius:29px; border:none;
    font-size:17px; font-weight:600; cursor:pointer;
    background:var(--grad); color:#fff;
    box-shadow:0 12px 26px -10px rgba(201,122,60,.7); transition:transform .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn.secondary{background:#fff; color:var(--amber-dark); box-shadow:inset 0 0 0 1.5px rgba(201,122,60,.28);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .g-badge{
    width:24px;height:24px;border-radius:50%;background:#fff;color:var(--amber-dark);
    font:700 13px/24px inherit; text-align:center; flex:none;
  }

  input[type="date"]{
    width:100%; padding:16px 18px; border-radius:16px;
    background:var(--cream); box-shadow:inset 0 0 0 1.5px rgba(201,122,60,.22);
    font-size:19px; font-weight:600; color:var(--text); outline:none; border:none; margin-bottom:0;
  }

  .logo-badge{
    width:92px;height:92px;border-radius:30px;background:var(--grad);
    box-shadow:0 18px 34px -14px rgba(201,122,60,.75);
    display:flex; align-items:center; justify-content:center; margin:0 auto;
  }
  .logo-heart{width:38px;height:38px;position:relative;transform:rotate(45deg) translate(-3px,3px);}
  .logo-heart div{position:absolute;background:#fff;}
  .logo-heart .sq{inset:0;border-radius:0 0 4px 0;}
  .logo-heart .c1{left:-50%;top:0;width:100%;height:100%;border-radius:50%;}
  .logo-heart .c2{left:0;top:-50%;width:100%;height:100%;border-radius:50%;}

  .not-https-warning{
    background:#fff3cd; color:#8a6414; border-radius:14px; padding:14px 16px;
    font-size:13px; line-height:1.7; margin-bottom:16px;
  }
  .error-card{
    display:flex; gap:10px; align-items:flex-start; background:#fff; border-radius:18px;
    padding:14px 16px; box-shadow:inset 0 0 0 1px rgba(158,78,34,.16); margin-top:16px;
  }
  .error-card .x{
    width:20px;height:20px;flex:none;border-radius:50%;background:var(--terracotta);color:#fff;

    position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden;

  .upload-fab{

  .upload-progress{

    flex:1; height:54px; border-radius:27px; background:#fff; box-shadow:inset 0 0 0 1.5px rgba(67,48,30,.14);
    color:var(--text-soft); font-size:16px; font-weight:600; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

    flex:1.4; height:54px; border-radius:27px; background:var(--grad);
    box-shadow:0 12px 24px -10px rgba(201,122,60,.7);
    color:#fff; font-size:16px; font-weight:600; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
</style>

<body>
<div id="app">

  <!-- LOGIN -->

      <div id="https-warning" class="not-https-warning" style="display:none;">

  <!-- LOADING -->

      <div class="big-spinner"></div>
      <p class="center-msg" id="loading-text">正在準備你們的回憶空間...</p>

  <!-- SET ANNIVERSARY (first run) -->

    <div class="center-col">
      <h1 class="title" style="text-align:left;">設定紀念日</h1>

  <!-- GALLERY -->
  <div class="screen" id="screen-gallery">

    <div class="row"><span id="upload-progress-text">上傳中...</span><span id="upload-progress-pct">0%</span></div>
    <div class="bar-bg"><div class="bar-fill" id="upload-progress-bar" style="width:0%;"></div></div>

</div>

<!-- photo viewer modal -->
<div class="modal-overlay" id="viewer-overlay">

<!-- edit anniversary bottom sheet -->

  <div class="sheet-box">
    <div class="sheet-handle"></div>
    <h3>編輯紀念日</h3>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div class="label-mono">START DATE</div>
      <input type="date" id="edit-anniv-input">

    <div class="sheet-actions">
      <button class="btn-cancel" id="btn-edit-anniv-cancel">取消</button>
      <button class="btn-save" id="btn-edit-anniv-save">儲存</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============== CONFIG（把你的 Client ID 貼在這裡） ============== */
  const GOOGLE_CLIENT_ID = "757486666065-c4s2d76o8ntpbalibogltibn5l19r55k.apps.googleusercontent.com";
  const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
  const FOLDER_NAME = "💕 我們的回憶";
  const SETTINGS_FILENAME = "settings.json";
  const MILESTONES = [100,200,300,500,750,1000,1500,2000,2500,3000,4000,5000,7500,10000,15000,20000];
  /* =================================================================== */

  let accessToken = null;
  let tokenClient = null;
  let folderId = null;
  let settingsFileId = null;
  let settings = { anniversary: null };
  let currentViewingFile = null;

  /* ---------------- SCREEN NAV ---------------- */
  function show(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo(0,0);
  }

  /* ---------------- BOOT ---------------- */
  window.addEventListener("DOMContentLoaded", ()=>{
    if(location.protocol === "file:"){
      document.getElementById("https-warning").style.display = "block";
    }
    document.getElementById("btn-google-signin").addEventListener("click", onSignInClick);
    document.getElementById("btn-save-anniv").addEventListener("click", onSaveFirstAnniversary);
    document.getElementById("btn-goto-gallery").addEventListener("click", openGallery);
    document.getElementById("btn-edit-anniv").addEventListener("click", openEditAnniv);
    document.getElementById("btn-logout").addEventListener("click", onLogout);
    document.getElementById("btn-gallery-back").addEventListener("click", ()=>{ show("screen-home"); toggleFab(false); });
    document.getElementById("btn-gallery-refresh").addEventListener("click", loadGallery);
    document.getElementById("btn-upload").addEventListener("click", ()=> document.getElementById("file-input").click());
    document.getElementById("file-input").addEventListener("change", onFilesSelected);
    document.getElementById("btn-viewer-close").addEventListener("click", closeViewer);
    document.getElementById("btn-viewer-delete").addEventListener("click", ()=>{
      document.getElementById("confirm-overlay").classList.add("active");
    });
    document.getElementById("btn-cancel-delete").addEventListener("click", ()=>{
      document.getElementById("confirm-overlay").classList.remove("active");
    });
    document.getElementById("btn-confirm-delete").addEventListener("click", onDeletePhoto);
    document.getElementById("btn-edit-anniv-save").addEventListener("click", onSaveEditAnniv);
    document.getElementById("btn-edit-anniv-cancel").addEventListener("click", ()=>{
      document.getElementById("edit-anniv-overlay").classList.remove("active");
    });

    if(window.google && google.accounts && google.accounts.oauth2){
      initGis();
    } else {
      window.addEventListener("load", ()=>{ if(window.google) initGis(); });
    }
  });

  function initGis(){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (resp)=>{
        if(resp.error){
          showLoginError("登入失敗：" + resp.error + "（若顯示 unverified app，請點『進階』→『前往(不安全)』繼續）");
          return;
        }
        accessToken = resp.access_token;
        afterSignIn();
      }
    });
  }

  function showLoginError(msg){
    const status = document.getElementById("login-status");
    status.innerHTML = "";
    const card = document.createElement("div");
    card.className = "error-card";
    card.innerHTML = '<span class="x">!</span><p>'+msg+'</p>';
    status.appendChild(card);
  }

  function onSignInClick(){
    if(GOOGLE_CLIENT_ID.indexOf("YOUR_CLIENT_ID_HERE") !== -1){
      alert("還沒有設定 Google Client ID 喔，請照教學把 Client ID 貼到程式碼裡的 CONFIG 區塊。");
      return;
    }
    if(!tokenClient){
      alert("Google 登入元件還在載入，請稍等幾秒再試一次。");
      return;
    }
    const btn = document.getElementById("btn-google-signin");
    btn.innerHTML = '<span class="btn-spinner"></span>登入中...';
    document.getElementById("login-status").innerHTML = "";
    tokenClient.requestAccessToken({ prompt: "" });
  }

  function resetSigninButton(){
    document.getElementById("btn-google-signin").innerHTML = '<span class="g-badge">G</span>使用 Google 帳號登入';
  }

  function onLogout(){
    accessToken = null;
    folderId = null;
    settingsFileId = null;
    settings = { anniversary: null };
    resetSigninButton();
    document.getElementById("login-status").innerHTML = "";
    show("screen-login");
  }

  /* ---------------- AFTER SIGN IN ---------------- */
  async function afterSignIn(){
    show("screen-loading");
    document.getElementById("loading-text").textContent = "正在準備你們的回憶空間...";
    try{
      folderId = await findOrCreateFolder();
      settingsFileId = await findSettingsFile(folderId);
      if(settingsFileId){
        settings = await readSettingsFile(settingsFileId);
      } else {
        settings = { anniversary: null };
      }
      if(!settings.anniversary){
        show("screen-set-anniv");
      } else {
        show("screen-home");
        renderHome();
      }
    }catch(err){
      console.error(err);
      resetSigninButton();
      showLoginError("連線 Google 雲端硬碟時發生問題，請確認 Client ID 設定正確，或稍後再試一次。錯誤訊息："+err.message);
      show("screen-login");
    }
  }

  /* ---------------- DRIVE HELPERS ---------------- */
  async function driveFetch(path, options){
    options = options || {};
    const headers = Object.assign({ "Authorization": "Bearer "+accessToken }, options.headers||{});
    const res = await fetch("https://www.googleapis.com/drive/v3/"+path, Object.assign({}, options, {headers}));
    if(!res.ok){
      const t = await res.text();
      throw new Error("Drive API "+res.status+": "+t.slice(0,200));
    }
    return res;
  }

  async function findOrCreateFolder(){
    const q = encodeURIComponent("name='"+FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const res = await driveFetch("files?q="+q+"&fields=files(id,name)&spaces=drive");
    const data = await res.json();
    if(data.files && data.files.length>0) return data.files[0].id;
    const createRes = await driveFetch("files", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name:FOLDER_NAME, mimeType:"application/vnd.google-apps.folder"})
    });
    const created = await createRes.json();
    return created.id;
  }

  async function findSettingsFile(fid){
    const q = encodeURIComponent("name='"+SETTINGS_FILENAME+"' and '"+fid+"' in parents and trashed=false");
    const res = await driveFetch("files?q="+q+"&fields=files(id,name)&spaces=drive");
    const data = await res.json();
    return (data.files && data.files[0]) ? data.files[0].id : null;
  }

  async function readSettingsFile(fid){
    const res = await driveFetch("files/"+fid+"?alt=media");
    try{ return await res.json(); }catch(e){ return {anniversary:null}; }
  }

  async function saveSettingsFile(newSettings){
    const content = JSON.stringify(newSettings);
    if(settingsFileId){
      await fetch("https://www.googleapis.com/upload/drive/v3/files/"+settingsFileId+"?uploadType=media", {
        method:"PATCH",
        headers:{ "Authorization":"Bearer "+accessToken, "Content-Type":"application/json" },
        body: content
      });
    } else {
      settingsFileId = await createFileMultipart(SETTINGS_FILENAME, "application/json", content, folderId);
    }
    settings = newSettings;
  }

  async function createFileMultipart(filename, mimeType, bodyContent, parentId){
    const metadata = { name: filename, parents:[parentId] };
    const boundary = "-------driveboundary" + Date.now() + Math.random().toString(16).slice(2);
    const delimiter = "\r\n--"+boundary+"\r\n";
    const closeDelim = "\r\n--"+boundary+"--";
    const metaPart = delimiter + "Content-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata);
    const mediaHeader = delimiter + "Content-Type: "+mimeType+"\r\n\r\n";

    let bodyBlob;
    if(bodyContent instanceof Blob){
      bodyBlob = new Blob([metaPart, mediaHeader, bodyContent, closeDelim]);
    } else {
      bodyBlob = new Blob([metaPart, mediaHeader, bodyContent, closeDelim], {type:"text/plain"});
    }

    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method:"POST",
      headers:{ "Authorization":"Bearer "+accessToken, "Content-Type":"multipart/related; boundary="+boundary },
      body: bodyBlob
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error("上傳失敗 "+res.status+": "+t.slice(0,200));
    }
    const data = await res.json();
    return data.id;
  }

  async function listPhotos(){
    const q = encodeURIComponent("'"+folderId+"' in parents and mimeType contains 'image/' and trashed=false");
    const res = await driveFetch("files?q="+q+"&orderBy=createdTime desc&fields=files(id,name,thumbnailLink,createdTime)&pageSize=300&spaces=drive");
    const data = await res.json();
    return data.files || [];
  }

  /* ---------------- FIRST-RUN ANNIVERSARY ---------------- */
  async function onSaveFirstAnniversary(){
    const val = document.getElementById("anniv-date-input").value;
    if(!val){ alert("請選擇日期喔～"); return; }
    show("screen-loading");
    document.getElementById("loading-text").textContent = "儲存中...";
    try{
      await saveSettingsFile({ anniversary: val });
      show("screen-home");
      renderHome();
    }catch(err){
      alert("儲存失敗，請再試一次。\n"+err.message);
      show("screen-set-anniv");
    }
  }

  function openEditAnniv(){
    document.getElementById("edit-anniv-input").value = settings.anniversary || "";
    document.getElementById("edit-anniv-overlay").classList.add("active");
  }
  async function onSaveEditAnniv(){
    const val = document.getElementById("edit-anniv-input").value;
    if(!val){ alert("請選擇日期喔～"); return; }
    document.getElementById("edit-anniv-overlay").classList.remove("active");
    show("screen-loading");
    document.getElementById("loading-text").textContent = "更新中...";
    try{
      await saveSettingsFile(Object.assign({}, settings, {anniversary: val}));
      show("screen-home");
      renderHome();
    }catch(err){
      alert("更新失敗，請再試一次。\n"+err.message);
      show("screen-home");
    }
  }

  /* ---------------- HOME ---------------- */
  function getNextMilestone(days){
    for(const m of MILESTONES){
      if(m > days) return m;
    }
    return Math.ceil((days+1)/1000)*1000;
  }

  function renderHome(){
    const annivDate = new Date(settings.anniversary+"T00:00:00");
    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const annivMid = new Date(annivDate.getFullYear(), annivDate.getMonth(), annivDate.getDate());
    const diffDays = Math.round((todayMid - annivMid) / 86400000) + 1;
    const shownDays = diffDays>=0 ? diffDays : Math.abs(diffDays);
    document.getElementById("home-days").textContent = shownDays;
    const y = annivDate.getFullYear(), m = annivDate.getMonth()+1, d = annivDate.getDate();
    document.getElementById("home-date-sub").textContent = diffDays>=0
      ? ("從 "+y+"/"+m+"/"+d+" 開始")
      : ("距離 "+y+"/"+m+"/"+d+" 還有 "+Math.abs(diffDays)+" 天");

    if(diffDays >= 0){
      const next = getNextMilestone(diffDays);
      document.getElementById("stat-milestone-label").textContent = "距離 "+next+" 天";
      document.getElementById("stat-milestone-value").textContent = "還有 "+(next-diffDays)+" 天";
    } else {
      document.getElementById("stat-milestone-label").textContent = "紀念日倒數";
      document.getElementById("stat-milestone-value").textContent = Math.abs(diffDays)+" 天";
    }

    document.getElementById("stat-photo-count").textContent = "...";
    listPhotos().then(files=>{
      document.getElementById("stat-photo-count").textContent = files.length;
    }).catch(()=>{
      document.getElementById("stat-photo-count").textContent = "--";
    });
  }

  /* ---------------- GALLERY ---------------- */
  function toggleFab(visible){
    document.getElementById("btn-upload").style.display = visible ? "flex" : "none";
  }

  function openGallery(){
    show("screen-gallery");
    toggleFab(true);
    loadGallery();
  }

  function monthLabel(dateStr){
    const dt = new Date(dateStr);
    return dt.getFullYear()+" 年 "+(dt.getMonth()+1)+" 月";
  }

  async function loadGallery(){
    const container = document.getElementById("photo-grid-container");
    container.innerHTML = '<div class="photo-empty"><div class="center-msg">載入中...</div></div>';
    try{
      const files = await listPhotos();
      container.innerHTML = "";
      if(files.length === 0){
        container.innerHTML =
          '<div class="photo-empty">'+
            '<div class="icon-box"><div class="sq"></div></div>'+
            '<div>還沒有照片～<br>點右下角 ＋ 上傳第一張吧！</div>'+
          '</div>';
        return;
      }

      const groups = [];
      let currentKey = null, currentGroup = null;
      files.forEach(f=>{
        const key = f.createdTime ? f.createdTime.slice(0,7) : "unknown";
        if(key !== currentKey){
          currentKey = key;
          currentGroup = { key, label: f.createdTime ? monthLabel(f.createdTime) : "", files: [] };
          groups.push(currentGroup);
        }
        currentGroup.files.push(f);
      });

      groups.forEach(g=>{
        const labelEl = document.createElement("div");
        labelEl.className = "month-label";
        labelEl.textContent = g.label + " · " + g.files.length + " 張";
        container.appendChild(labelEl);

        const grid = document.createElement("div");
        grid.className = "photo-grid";
        g.files.forEach(f=>{
          const div = document.createElement("div");
          div.className = "photo-thumb";
          const img = document.createElement("img");
          img.loading = "lazy";
          img.src = f.thumbnailLink || "";
          img.alt = f.name || "";
          img.addEventListener("error", ()=>{ loadFullImageAsThumb(f.id, img); });
          div.appendChild(img);
          div.addEventListener("click", ()=> openViewer(f));
          grid.appendChild(div);
        });
        container.appendChild(grid);
      });
    }catch(err){
      container.innerHTML = '<div class="photo-empty"><div>載入失敗，下拉重新整理再試一次。</div></div>';
      console.error(err);
    }
  }

  async function loadFullImageAsThumb(fileId, imgEl){
    try{
      const res = await driveFetch("files/"+fileId+"?alt=media");
      const blob = await res.blob();
      imgEl.src = URL.createObjectURL(blob);
    }catch(e){ /* leave broken, non-fatal */ }
  }

  async function onFilesSelected(e){
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    const progress = document.getElementById("upload-progress");
    const textEl = document.getElementById("upload-progress-text");
    const pctEl = document.getElementById("upload-progress-pct");
    const barEl = document.getElementById("upload-progress-bar");
    progress.classList.add("active");
    for(let i=0;i<files.length;i++){
      const pct = Math.round(((i)/files.length)*100);
      textEl.textContent = "上傳中 "+(i+1)+" / "+files.length+" ...";
      pctEl.textContent = pct+"%";
      barEl.style.width = pct+"%";
      try{
        await createFileMultipart(files[i].name || ("photo_"+Date.now()+".jpg"), files[i].type || "image/jpeg", files[i], folderId);
      }catch(err){
        console.error(err);
        alert("有一張照片上傳失敗："+files[i].name);
      }
    }
    barEl.style.width = "100%";
    pctEl.textContent = "100%";
    setTimeout(()=>{ progress.classList.remove("active"); }, 400);
    e.target.value = "";
    loadGallery();
  }

  /* ---------------- VIEWER ---------------- */
  function openViewer(file){
    currentViewingFile = file;
    document.getElementById("viewer-img").src = file.thumbnailLink || "";
    const dateStr = file.createdTime ? file.createdTime.slice(0,10).replace(/-/g,"/") : "";
    document.getElementById("viewer-caption").textContent = [dateStr, file.name].filter(Boolean).join(" · ");
    document.getElementById("viewer-overlay").classList.add("active");
    driveFetch("files/"+file.id+"?alt=media").then(res=>res.blob()).then(blob=>{
      document.getElementById("viewer-img").src = URL.createObjectURL(blob);
    }).catch(()=>{});
  }
  function closeViewer(){
    document.getElementById("viewer-overlay").classList.remove("active");
    currentViewingFile = null;
  }
  async function onDeletePhoto(){
    document.getElementById("confirm-overlay").classList.remove("active");
    if(!currentViewingFile) return;
    try{
      await driveFetch("files/"+currentViewingFile.id, {method:"DELETE"});
      closeViewer();
      loadGallery();
    }catch(err){
      alert("刪除失敗，請再試一次。");
    }
  }

})();
</script>
